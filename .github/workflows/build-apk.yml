name: Build TV Dashboard APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/brief.json"     # daily news updates don't need a new APK
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Bundle the dashboard into the app (offline fallback)
        run: |
          mkdir -p app/src/main/assets
          cp docs/index.html app/src/main/assets/index.html

      - name: Build APK
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gradle :app:assembleDebug -PdashboardUrl="https://${OWNER}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/upload-artifact@v4
        with:
          name: tv-dashboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
