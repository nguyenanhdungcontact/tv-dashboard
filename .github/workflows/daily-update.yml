name: Daily content update

on:
  schedule:
    - cron: "0 23 * * *"   # once a day, 06:00 Vietnam time – news + 10 new words
  workflow_dispatch:
    inputs:
      tasks:
        description: "What to update"
        default: "news words"
      force:
        description: "Run again even if today's content already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repo-commit          # same group as the video workflow, so pushes never collide
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # batch results usually arrive within minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update content with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          TASKS="${{ inputs.tasks }}"
          [ -z "$TASKS" ] && TASKS="news words"
          FLAGS=""
          [ "${{ inputs.force }}" = "true" ] && FLAGS="--force"
          python scripts/daily_update.py $TASKS $FLAGS

      - name: Commit changes
        run: |
          git config user.name "tv-dashboard-bot"
          git config user.email "tv-dashboard-bot@users.noreply.github.com"
          for f in docs/brief.json docs/words.json scripts/state.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Daily update $(TZ=Asia/Ho_Chi_Minh date '+%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
