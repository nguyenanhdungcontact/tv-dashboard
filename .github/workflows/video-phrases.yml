name: Video daily (new videos + phrases)

on:
  schedule:
    # 4:00 sáng giờ VN. YouTube thường chặn lấy phụ đề từ máy chủ GitHub; khi đó máy Mac
    # (scripts/install_daily_mac.sh, 6:30 sáng) sẽ làm phần còn lại.
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  phrases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install "youtube-transcript-api>=1.2,<2" requests

      # Transcript gốc giữ trong bộ nhớ đệm của Actions, không commit vào repo công khai
      - name: Bộ nhớ đệm transcript
        uses: actions/cache@v4
        with:
          path: .cache/transcripts
          key: transcripts-${{ github.run_id }}
          restore-keys: transcripts-

      - name: Tìm video mới, lấy phụ đề, soạn cụm từ
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: python -u scripts/video_daily.py

      - name: Lưu kết quả vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/video-data video/state.json
          if git diff --cached --quiet; then
            echo "Không có gì mới."
            exit 0
          fi
          git commit -m "Video mới và cụm từ $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 10
          done
          exit 1
