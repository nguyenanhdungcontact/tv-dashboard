<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học qua video">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Học qua video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<script>
/* Sáng/tối dùng chung với dashboard và trang TV: 'auto' theo giờ (6:00–18:00 sáng), 'day', 'night' */
window.themePref = function(){
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'day' || q === 'night') return q;
  try { const v = localStorage.getItem('tvv.theme'); if (v === 'day' || v === 'night') return v; } catch(e){}
  return 'auto';
};
window.applyTheme = function(){
  const pref = themePref(), h = new Date().getHours();
  const day = pref === 'auto' ? (h >= 6 && h < 18) : pref === 'day';
  document.documentElement.classList.toggle('day', day);
  document.documentElement.classList.toggle('night', !day);
};
window.setThemePref = function(v){ try { localStorage.setItem('tvv.theme', v); } catch(e){} applyTheme(); };
applyTheme(); setInterval(applyTheme, 60000);
</script>
<style>
:root{
  --bg:#f6f1e4; --bg2:#ece5d2; --surface:#fffdf7; --surface2:#f3eee1; --line:rgba(52,70,42,.13);
  --ink:#26331f; --ink2:#5b6852; --ink3:#8b927e;
  --accent:#4f7d45; --accent-ink:#fff; --accent-soft:rgba(79,125,69,.12);
  --warm:#c06a1f; --warm-soft:rgba(192,106,31,.12); --ipa:#3c7486;
  --shadow:0 .5rem 1.6rem rgba(52,62,36,.12);
  --head:'Fraunces',Georgia,serif; --body:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:light;
}
:root.night{
  --bg:#0b0f2a; --bg2:#141a45; --surface:#151b44; --surface2:#1c2354; --line:rgba(200,208,255,.12);
  --ink:#eef0ff; --ink2:#a9b0de; --ink3:#727ab0;
  --accent:#8fa2ff; --accent-ink:#0b0f2a; --accent-soft:rgba(143,162,255,.16);
  --warm:#ffd36e; --warm-soft:rgba(255,211,110,.14); --ipa:#8fd0e0;
  --shadow:0 .6rem 2rem rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(ellipse 70% 40% at 100% 0%, var(--warm-soft), transparent 60%),
    radial-gradient(ellipse 60% 40% at 0% 100%, var(--accent-soft), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.hide{display:none!important}

/* ---------- Thanh trên ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 20px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top h1{font-family:var(--head);font-weight:800;font-size:24px;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:4px;gap:2px}
.seg button{padding:9px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink2);min-height:40px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.icon-btn{min-width:44px;min-height:44px;border-radius:999px;display:grid;place-items:center;font-size:18px;background:var(--surface2);padding:0 14px;font-weight:600;font-size:15px}
.back{font-size:22px;padding:0;width:44px}

/* ---------- Danh sách video ---------- */
main{padding:8px 0 40px}
.row{margin:22px 0 4px}
.row h2{font-family:var(--head);font-weight:700;font-size:22px;padding:0 20px;display:flex;align-items:baseline;gap:10px}
.row h2 small{font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink3)}
.track{display:flex;gap:16px;overflow-x:auto;padding:12px 20px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 clamp(220px,30vw,300px);scroll-snap-align:start;text-align:left}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(10,12,20,.78);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px}
.badge{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 8px;border-radius:7px}
.card .t{margin-top:10px;font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c{margin-top:3px;font-size:13px;color:var(--ink3)}
.card:active .thumb{transform:scale(.98)}
.note{margin:18px 20px 0;color:var(--ink3);font-size:14px;line-height:1.5}

/* ---------- Màn xem ---------- */
.watch{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:20px;padding:16px 20px 24px;align-items:start}
.stage{position:sticky;top:84px}
.vbox{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#000;box-shadow:var(--shadow)}
.vbox iframe,.vbox #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
/* Kéo khung YouTube cao hơn rồi cắt trên/dưới: ẩn tiêu đề, nút, thanh thời gian của YouTube.
   Hình vẫn đầy khung vì YouTube giữ tỉ lệ 16:9 ở giữa. Lớp .tap nhận chạm để phát/dừng. */
#vbox #yt{top:-40%;bottom:auto;height:180%}
.vbox .tap{position:absolute;inset:0;z-index:2;display:none}
.vbox.started .tap{display:block}
.vbox.started iframe{pointer-events:none}
.side-tools{display:none}
.detail > *{flex-shrink:0}
.cap{margin-top:12px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:17px;line-height:1.4;text-align:center;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}
.cap:empty::before{content:"Phụ đề sẽ hiện ở đây";color:var(--ink3);font-size:15px}
.cap mark,.quote mark{background:none;color:var(--warm);font-weight:700}
.cap.off{display:none}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ctrls button{min-height:46px;padding:0 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.ctrls button.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;min-width:110px;justify-content:center}
.ctrls button.on{background:var(--accent-soft);border-color:var(--accent)}
.vtitle{margin-top:14px;font-family:var(--head);font-weight:700;font-size:20px;line-height:1.3}
.vsub{margin-top:4px;color:var(--ink3);font-size:14px}

.side{min-width:0}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--shadow)}
.d-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink3);font-weight:600}
.d-top .live{color:var(--warm)}
.d-p{font-family:var(--head);font-weight:800;font-size:28px;line-height:1.15;margin-top:6px}
.d-ipa{color:var(--ipa);font-size:16px;margin-top:4px}
.d-m{font-size:17px;margin-top:6px;font-weight:500}
.quote{margin-top:12px;padding:10px 12px;border-left:3px solid var(--warm);background:var(--warm-soft);border-radius:4px 10px 10px 4px;font-style:italic;font-size:16px;line-height:1.5}
.d-u{margin-top:10px;font-size:15px;line-height:1.5;color:var(--ink2)}
.d-ex{margin-top:10px;font-size:15px;line-height:1.5}
.d-ex small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.d-act{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.d-act button{min-height:48px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:15px}
.d-act button.primary{background:var(--accent);color:var(--accent-ink)}
.d-act button.saved{background:var(--warm-soft);color:var(--warm)}
.sum{margin:16px 2px 8px;font-size:14px;line-height:1.55;color:var(--ink2)}
.lhead{display:flex;align-items:baseline;gap:10px;margin:18px 2px 8px}
.lhead h3{font-family:var(--head);font-size:19px}
.lhead span{font-size:13px;color:var(--ink3)}
.lvl{font-size:12px;font-weight:700;color:var(--warm);border:1px solid var(--warm);border-radius:6px;padding:1px 6px}
.ph{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 12px 12px 14px;border-radius:12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line)}
.ph .tx{flex:1;min-width:0}
.ph .p{font-weight:700;font-size:16px}
.ph .m{font-size:14px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .tm{font-size:13px;color:var(--ink3);font-weight:600;font-variant-numeric:tabular-nums}
.ph{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s}
.ph .st{flex:none;width:30px;height:30px;margin:-6px 0 -6px -6px;display:grid;place-items:center;border-radius:50%;font-size:18px;color:var(--ink3)}
.ph .st.on{color:var(--warm)}
.ph.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ph.now .tm{color:var(--warm)}
.ph.now .tm::before{content:"● "}
.empty{padding:22px;border-radius:var(--r);background:var(--surface);border:1px dashed var(--line);color:var(--ink2);line-height:1.55}

/* ---------- Từ đã lưu ---------- */
.saved-wrap{max-width:860px;margin:0 auto;padding:16px 20px 40px}
.sw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.sw .h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sw .w{font-family:var(--head);font-weight:800;font-size:22px}
.sw .i{color:var(--ipa);font-size:15px}
.sw .v{margin-top:4px;font-size:16px}
.sw .e{margin-top:6px;font-size:15px;color:var(--ink2);font-style:italic}
.sw .src{margin-top:8px;font-size:13px;color:var(--ink3)}
.sw .a{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sw .a button{min-height:42px;padding:0 14px;border-radius:10px;background:var(--surface2);font-weight:600;font-size:14px}

/* ---------- Cờ video, Lịch sử học ---------- */
.card.watched .thumb img{opacity:.45;filter:saturate(.6)}
.wl{position:absolute;left:8px;bottom:8px;background:rgba(10,12,20,.8);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.newb{position:absolute;right:8px;top:8px;background:#e8643c;color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:6px}
.hist{margin:30px 20px 0;border-top:1px solid var(--line);padding-top:6px}
.hist-head{display:flex;align-items:baseline;gap:10px;width:100%;padding:14px 0;text-align:left}
.hist-head span{font-family:var(--head);font-weight:700;font-size:20px}
.hist-head small{font-size:14px;color:var(--ink3)}
.hist-head em{margin-left:auto;font-style:normal;font-weight:600;font-size:15px;color:var(--accent)}
.hist .track{padding-left:0;padding-right:0}
.ctrls button.on{background:var(--accent-soft);border-color:var(--accent)}
body.watching #backBtn{display:grid!important}
body.watching #tabs,body.watching #syncBtn{display:none!important}
#syncBtn.off::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#e8643c;margin-left:6px;vertical-align:middle}

/* ---------- Bảng trượt (hỏi đánh dấu, đồng bộ) ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.show{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(10,12,20,.45);animation:fade .2s}
.sheet-card{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(620px,100%);max-height:88dvh;overflow:auto;
  background:var(--surface);border-radius:22px 22px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .25s ease}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet-card h3{font-family:var(--head);font-weight:800;font-size:22px;line-height:1.25}
.sheet-card .sub{margin-top:6px;color:var(--ink2);font-size:15px;line-height:1.45}
.sheet-acts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.sheet-acts button{min-height:50px;border-radius:14px;background:var(--surface2);font-weight:600;font-size:16px;padding:0 16px;text-align:center}
.sheet-acts button.primary{background:var(--accent);color:var(--accent-ink)}
.sync{display:flex;gap:18px;align-items:flex-start;margin-top:16px}
.sync .qr{flex:none;width:196px;height:196px;padding:8px;border-radius:14px;background:#fff;display:grid;place-items:center}
.sync .qr img,.sync .qr canvas{width:100%!important;height:auto!important}
.sync-txt{font-size:15px;line-height:1.5;color:var(--ink2);min-width:0}
.sync-txt b{color:var(--ink)}
.sync-txt .small{font-size:13px;margin-top:8px;word-break:break-all}
.sync-txt code{font-size:12.5px;color:var(--ink)}
.join{display:flex;gap:8px;margin-top:10px}
.join input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.join button{min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:560px){ .sync{flex-direction:column;align-items:center} }

/* Khoảng trống cuối danh sách: cụm cuối cùng vẫn được cuộn lên sát đầu (ngay dưới video) */
#plist::after{content:"";display:block;height:88vh}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:50;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;font-weight:500;max-width:90vw;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* iPad ngang (như TV): trái = video + phụ đề + nút + thẻ chi tiết; phải = danh sách cụm từ cuộn riêng */
@media (min-width:901px) and (orientation:landscape){
  html,body{height:100%;overflow:hidden}
  body.watching .top{display:none}
  body.watching .side-tools{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:3;background:var(--bg);padding:2px 0 8px}
  .side-tools .icon-btn{min-height:40px;min-width:40px;font-size:14px}
  .side-tools .back{font-size:20px}
  .st-title{flex:1;min-width:0;font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .watch{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));grid-template-columns:minmax(0,1fr) clamp(300px,31vw,380px);
    gap:18px;padding:14px 18px 14px 20px;align-items:stretch}
  .stage{position:static;display:flex;flex-direction:column;min-height:0}
  .vbox{flex:none;width:100%;max-height:55%;aspect-ratio:16/9;align-self:center}
  .cap{flex:none;min-height:38px;margin-top:8px;font-size:15px;padding:7px 12px}
  .ctrls{flex:none;margin-top:8px;gap:6px}
  .ctrls button{min-height:40px;font-size:14px;padding:0 13px}
  .ctrls button.main{min-width:96px}
  #detail{flex:1;min-height:0;margin-top:10px;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
  .detail{padding:12px 16px;box-shadow:none}
  .d-top{font-size:12px}
  .d-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .d-p{font-size:21px;margin-top:2px}
  .d-ipa{margin-top:0;font-size:14px}
  .d-m{font-size:15px;margin-top:3px}
  .quote{font-size:14px;margin-top:8px;padding:7px 10px}
  .d-u{font-size:13px;margin-top:7px}
  .d-ex{font-size:13.5px;margin-top:7px}
  .d-ex small{font-size:12.5px}
  .d-act button{font-size:14px}
  .sum{font-size:13px;margin:4px 2px 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .lhead{margin:4px 2px 6px}
  .lhead h3{font-size:17px}
  .ph{padding:9px 10px 9px 12px;margin-bottom:6px}
  .ph .p{font-size:14.5px}
  .ph .m{font-size:12.5px}
  .ph .tm{font-size:12px}
  .detail{min-height:100%;display:flex;flex-direction:column}
  .d-act{grid-template-columns:repeat(2,auto);justify-content:start;margin-top:auto;padding-top:12px;
    position:sticky;bottom:-12px;background:var(--surface);padding-bottom:12px;margin-bottom:-12px}
  .d-act button{padding:0 16px;min-height:40px}
  .vtitle,.vsub{display:none}
  .side{overflow:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-right:2px}
  .side .lhead{margin-top:2px}
  #home,#savedView{height:calc(100dvh - 73px);overflow:auto;-webkit-overflow-scrolling:touch}
}
@media (min-width:901px) and (orientation:landscape) and (max-height:700px){
  .vbox{max-height:50%}
  .d-u{display:none}
}

/* iPad dọc / màn hẹp: video trên, cụm từ dưới */
@media (max-width:900px), (orientation:portrait){
  .watch{grid-template-columns:1fr}
  #detail{margin-top:4px}
  .stage{position:sticky;top:72px;z-index:5;background:var(--bg);padding-bottom:10px;margin:0 -20px;padding-left:20px;padding-right:20px}
  .vtitle,.vsub{display:none}
  .cap{font-size:17px;min-height:50px}
}
@media (max-width:560px){
  .top h1{font-size:19px}
  .seg button{padding:8px 11px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="icon-btn back hide" id="backBtn" aria-label="Quay lại">←</button>
  <h1 id="title">Học qua video</h1>
  <div class="seg" id="tabs">
    <button data-tab="videos" class="on">Video</button>
    <button data-tab="saved">Từ đã lưu <span class="savedCount"></span></button>
  </div>
  <button class="icon-btn" id="syncBtn" aria-label="Đồng bộ">⇅ Đồng bộ</button>
  <button class="icon-btn" id="themeBtn" aria-label="Đổi sáng/tối"></button>
</header>

<main id="home"></main>

<section id="watch" class="watch hide">
  <div class="stage">
    <div class="vbox" id="vbox"><div id="yt"></div><button class="tap" id="tapLayer" aria-label="Phát / dừng"></button></div>
    <div class="cap" id="cap"></div>
    <div class="ctrls">
      <button id="bBack">⟲ 5s</button>
      <button class="main" id="bPlay">▶ Phát</button>
      <button id="bFwd">10s ⟳</button>
      <button id="bSpeed">1×</button>
      <button id="bCC" class="on">CC</button>
      <button id="bDone" class="hide" title="Đánh dấu đã xem (xếp cuối hàng)">✓ Xem xong</button>
      <button id="bArch" class="hide" title="Cất vào Lịch sử học">🗂 Lưu trữ</button>
      <button id="bYT" title="Mở trong app YouTube (Premium không quảng cáo)">YouTube ↗</button>
    </div>
    <div id="detail"></div>
