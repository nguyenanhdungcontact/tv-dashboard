<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kênh nhà mình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<script>
/* Ngày 6:00–18:00 dùng giao diện khu vườn sáng, tối dùng trời sao (chế độ Tự động); có thể chọn cố định Sáng/Tối */
/* Chế độ sáng/tối: 'auto' (theo giờ), 'day' hoặc 'night'. Lưu chung cho dashboard và trang video. */
window.themePref = function(){
  const q = new URLSearchParams(location.search).get('theme');
  if (q === 'day' || q === 'night') return q;
  try { const v = localStorage.getItem('tvv.theme'); if (v === 'day' || v === 'night') return v; } catch(e){}
  return 'auto';
};
window.applyTheme = function(){
  const pref = themePref(), h = new Date().getHours();
  const day = pref === 'auto' ? (h >= 6 && h < 18) : pref === 'day';
  document.documentElement.classList.toggle('day', day);
  document.documentElement.classList.toggle('night', !day);
};
window.setThemePref = function(v){ try { localStorage.setItem('tvv.theme', v); } catch(e){} applyTheme(); };
applyTheme(); setInterval(applyTheme, 60000);
</script>
<style>
:root{
  --bg0:#060920; --bg1:#0e1340; --bg2:#231b5e;
  --ink:#eef0ff; --ink2:#a6aee0; --ink3:#6e76ad;
  --accent:#8fa2ff;
  --ring:#ffffff; --glow:rgba(143,162,255,.6); --ringw:.22rem;
  --warm:#ffd36e;
  --cw:15.8rem; --gap:1.6rem;
  --head:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
/* 1 rem = 1/96 chiều ngang: 1920px → 20px, 960px (WebView TV) → 10px */
html{font-size:calc(100vw / 96)}
html,body{height:100%;overflow:hidden;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(ellipse 70% 55% at 78% -8%, #3b2f92 0%, transparent 62%),
    radial-gradient(ellipse 60% 45% at -5% 108%, #18397a 0%, transparent 60%),
    linear-gradient(180deg,var(--bg1),var(--bg0));
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:
    radial-gradient(1.5px 1.5px at 24px 34px,#fff,transparent),
    radial-gradient(1px 1px at 150px 86px,#cfd6ff,transparent),
    radial-gradient(1.5px 1.5px at 272px 170px,#fff,transparent),
    radial-gradient(1px 1px at 96px 222px,#aab4ff,transparent),
    radial-gradient(1px 1px at 338px 44px,#fff,transparent);
  background-size:390px 270px;
}
button{font-family:inherit}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:block}
#keytrap{position:fixed;left:-20px;top:0;width:1px;height:1px;opacity:0;border:0}

/* ---------- Chọn hồ sơ ---------- */
#profile.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
#profile h1{font-family:var(--head);font-weight:800;font-size:4.4rem;letter-spacing:-.03em}
#profile .sub{color:var(--ink2);font-size:1.3rem;margin:.6rem 0 4rem}
.profiles{display:flex;gap:6rem}
.pcard{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:20rem}
.pav{width:15rem;height:15rem;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:5.4rem;color:#fff;letter-spacing:-.04em;transition:transform .2s ease,box-shadow .2s ease;box-shadow:0 1rem 3rem rgba(0,0,0,.45)}
.me{background:linear-gradient(140deg,#6a7bff,#9a5cff)}
.par{background:linear-gradient(140deg,#ffb86e,#ff7a9c)}
.pname{font-family:var(--head);font-weight:700;font-size:2.3rem;margin-top:1.6rem;opacity:.8;transition:opacity .2s}
.pdesc{font-size:1.05rem;color:var(--ink2);text-align:center;line-height:1.45;margin-top:.5rem}
.pcard.focused .pav{transform:scale(1.08);box-shadow:0 0 0 .4rem #fff,0 0 0 1.1rem rgba(143,162,255,.45),0 1.4rem 3rem rgba(0,0,0,.5)}
.pcard.focused .pname{opacity:1}
#profile .foot{position:absolute;bottom:3rem;color:var(--ink3);font-size:1.05rem}

/* ---------- Màn hình chính ---------- */
#home header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:2.2rem 4rem 0;z-index:5}
.brand{font-family:var(--head);font-weight:800;font-size:2rem;letter-spacing:-.03em;display:flex;align-items:center;gap:.8rem}
.moon{width:1.3rem;height:1.3rem;border-radius:50%;background:var(--warm);box-shadow:0 0 1.4rem rgba(255,211,110,.7);position:relative;overflow:hidden}
.moon::after{content:"";position:absolute;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--bg1);left:.45rem;top:-.2rem}
.hright{display:flex;align-items:center;gap:2.2rem}
.clock{font-family:var(--head);font-weight:700;font-size:1.9rem;text-align:right;line-height:1.05}
.clock small{display:block;font-family:var(--body);font-weight:500;font-size:.9rem;color:var(--ink2)}
.chip{display:flex;align-items:center;gap:.8rem;padding:.45rem 1.3rem .45rem .45rem;border-radius:99rem;background:rgba(255,255,255,.07);border:.12rem solid rgba(255,255,255,.12);color:var(--ink);font-size:1.05rem;font-weight:600;cursor:pointer;transition:background .15s,box-shadow .15s}
.chip .av{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.05rem;color:#fff}
.chip em{font-style:normal;font-weight:500;color:var(--ink2);margin-left:.4rem}
.chip.focused{background:#fff;color:#141846;box-shadow:0 0 0 .4rem var(--glow)}
.chip.focused em{color:#4b5190}

#rows{position:absolute;top:8.4rem;left:0;right:0;bottom:0;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 1.4rem);mask-image:linear-gradient(to bottom,transparent 0,#000 1.4rem)}
#rowsInner{position:relative;transition:transform .32s ease;padding:1rem 0 7rem}
.row{margin-bottom:1.8rem}
.row h2{font-family:var(--head);font-weight:700;font-size:1.75rem;letter-spacing:-.015em;padding:0 4rem;display:flex;align-items:baseline;gap:1rem}
.row h2 span{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--ink3)}
.track-wrap{padding:1.1rem 4rem 1.2rem}
.track{position:relative;display:flex;gap:var(--gap);transition:transform .28s ease;will-change:transform}
.card{flex:0 0 var(--cw);width:var(--cw);cursor:pointer;transition:transform .18s ease;transform-origin:center 35%}
.thumb{position:relative;padding-top:56.25%;border-radius:.9rem;overflow:hidden;background:linear-gradient(135deg,#2c3285,#151a48);box-shadow:0 .4rem 1.2rem rgba(0,0,0,.35);transition:box-shadow .18s ease}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.noimg::before{content:"▶";position:absolute;inset:0;display:grid;place-items:center;font-size:3rem;color:rgba(255,255,255,.22)}
.dur{position:absolute;right:.5rem;bottom:.5rem;background:rgba(5,6,22,.86);color:#fff;font-size:.85rem;font-weight:600;padding:.15rem .5rem;border-radius:.35rem}
.meta{padding:.85rem .15rem 0}
.t{font-weight:600;font-size:1.05rem;line-height:1.35;color:#d9ddff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c{font-size:.88rem;color:var(--ink2);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.focused{transform:scale(1.07);position:relative;z-index:2}
.card.focused .thumb{box-shadow:0 0 0 var(--ringw) var(--ring),0 0 0 calc(var(--ringw) + .5rem) var(--glow),0 1.2rem 2.6rem rgba(0,0,0,.6)}
.card.focused .t{color:#fff}
.card.blocked .thumb::after{content:"Không phát được trên TV";position:absolute;inset:0;display:grid;place-items:center;background:rgba(8,10,30,.75);font-size:.95rem;font-weight:600;color:var(--ink2)}

.hint{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:2.4rem 4rem 1.4rem;background:linear-gradient(transparent,rgba(6,9,32,.96) 55%);display:flex;gap:2.6rem;font-size:1rem;color:var(--ink2)}
.k{display:inline-block;min-width:1.9rem;padding:.12rem .55rem;margin-right:.45rem;border-radius:.4rem;background:rgba(255,255,255,.13);color:#fff;font-weight:700;text-align:center}

/* ---------- Hồ sơ Bố mẹ: chữ to, viền vàng ---------- */
body.simple{--cw:20.6rem;--ring:var(--warm);--glow:rgba(255,211,110,.5);--ringw:.34rem}
body.simple .row h2{font-size:2.6rem}
body.simple .row h2 span{display:none}
body.simple .t{font-size:1.5rem;line-height:1.3}
body.simple .c{font-size:1.2rem}
body.simple .dur{font-size:1.2rem;padding:.2rem .6rem}
body.simple .hint{font-size:1.45rem}
body.simple .chip{font-size:1.35rem}

/* ---------- Trình phát ---------- */
#player{background:#000}
#ytWrap,#ytWrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#osd{position:absolute;top:2.4rem;left:50%;transform:translate(-50%,-.6rem);min-width:26rem;max-width:72rem;padding:1.1rem 2rem 1.2rem;border-radius:1.2rem;background:rgba(12,15,50,.9);box-shadow:0 1rem 3rem rgba(0,0,0,.5);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:5;text-align:center}
#osd.show{opacity:1;transform:translate(-50%,0)}
#osd .l1{font-family:var(--head);font-weight:700;font-size:1.7rem;letter-spacing:-.01em}
#osd .l2{font-size:1rem;color:var(--ink2);margin-top:.3rem}
#osd .bar{height:.35rem;border-radius:1rem;background:rgba(255,255,255,.15);margin-top:.85rem;overflow:hidden}
#osd .bar i{display:block;height:100%;width:0;background:var(--accent)}
#osd.nobar .bar{display:none}
body.simple #osd .l1{font-size:2.5rem}
body.simple #osd .l2{font-size:1.4rem}
body.simple #osd .bar i{background:var(--warm)}
#pBack{position:absolute;top:1.6rem;left:1.6rem;z-index:6;width:3.4rem;height:3.4rem;border-radius:50%;border:0;background:rgba(12,15,50,.7);color:#fff;font-size:1.6rem;cursor:pointer;opacity:.45;transition:opacity .2s}
#pBack:hover{opacity:1}

#endcard{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(6,9,32,.95)}
#endcard.show{display:flex}
.endbox{display:flex;gap:3.4rem;align-items:center;max-width:82rem;padding:0 4rem}
.endthumb{flex:0 0 36rem}
.endthumb .thumb{box-shadow:0 0 0 .3rem var(--ring),0 1.4rem 3rem rgba(0,0,0,.6)}
.endinfo .lbl{color:var(--ink2);font-size:1.25rem}
.endinfo h3{font-family:var(--head);font-weight:800;font-size:2.8rem;line-height:1.12;letter-spacing:-.02em;margin:.6rem 0 .5rem}
.endinfo .ch{color:var(--ink2);font-size:1.25rem}
.endinfo .cnt{margin-top:1.6rem;font-size:1.3rem;color:var(--ink2)}
.endinfo .cnt b{color:var(--warm);font-size:1.7rem}
.btns{display:flex;gap:1rem;margin-top:2rem}
.btn{padding:.9rem 1.8rem;border-radius:99rem;border:0;font-size:1.2rem;font-weight:600;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.btn.primary{background:#fff;color:#141846}
body.simple .endinfo h3{font-size:3.3rem}
body.simple .btn,body.simple .endinfo .cnt{font-size:1.6rem}

/* ---------- Chế độ học: video nhỏ bên trái, thẻ cụm từ bên dưới, danh sách bên phải ---------- */
/* --vw: bề rộng video khi học. Video nhỏ hơn thì YouTube tự chọn chất lượng thấp hơn, tua nhanh hơn */
#player{--vw:58rem;--pad:2rem;--vh:calc(var(--vw) * 9 / 16)}
#ytWrap{transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease,border-radius .3s}
#player.panel{background:transparent}
#player.panel #ytWrap{left:var(--pad);top:var(--pad);width:var(--vw);height:var(--vh);border-radius:1rem;overflow:hidden;box-shadow:0 1rem 3rem rgba(0,0,0,.5);background:#000}
#player.panel #osd{left:calc(var(--pad) + var(--vw) / 2);top:calc(var(--pad) + 1.2rem);min-width:20rem;max-width:calc(var(--vw) - 4rem)}
#player.panel #pBack{display:none}
#panel{position:absolute;top:0;right:0;bottom:0;width:calc(100% - var(--vw) - var(--pad) * 2);z-index:6;display:flex;flex-direction:column;
  transform:translateX(100%);opacity:0;transition:transform .3s ease,opacity .3s}
#player.panel #panel{transform:none;opacity:1}
.ph-head{padding:var(--pad) 1.6rem .8rem .4rem}
.ph-head h3{font-family:var(--head);font-weight:800;font-size:1.7rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:.7rem}
.ph-head h3 span{font-family:var(--body);font-weight:600;font-size:.9rem;color:var(--warm);padding:.1rem .5rem;border:.1rem solid rgba(255,211,110,.45);border-radius:.4rem}
.ph-head h3 em{font-family:var(--body);font-style:normal;font-weight:500;font-size:.95rem;color:var(--ink3)}
.ph-sum{margin-top:.5rem;font-size:.92rem;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph-list{flex:1;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 .8rem,#000 calc(100% - 2rem),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 .8rem,#000 calc(100% - 2rem),transparent 100%)}
.ph-inner{position:relative;padding:.8rem 1.6rem 6rem .4rem;transition:transform .25s ease}
.ph{padding:.75rem 1rem;border-radius:.8rem;margin-bottom:.45rem;background:rgba(255,255,255,.035);cursor:pointer;transition:background .15s,box-shadow .15s}
.ph .row1{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}
.ph .p{font-family:var(--head);font-weight:700;font-size:1.2rem;letter-spacing:-.01em;line-height:1.25}
.ph .tm{font-size:.82rem;color:var(--ink3);font-weight:600;flex:none}
.ph .m{font-size:.92rem;color:var(--ink2);margin-top:.15rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.sel{background:rgba(255,255,255,.12);box-shadow:0 0 0 var(--ringw) var(--ring)}
.ph.now .tm{color:var(--warm)}
.ph.now .tm::before{content:"● ";}
.ph-empty{padding:1rem .4rem;color:var(--ink2);font-size:1.1rem;line-height:1.55}
.ph-foot{padding:.9rem 1.6rem 1.3rem .4rem;font-size:.88rem;color:var(--ink3);display:flex;flex-wrap:wrap;gap:.4rem 1.2rem}
.ph-foot .k{font-size:.82rem}
.ph-foot .okl{color:#fff}

#learn{position:absolute;left:var(--pad);width:var(--vw);top:calc(var(--pad) + var(--vh) + 1.2rem);bottom:var(--pad);z-index:6;overflow:hidden;
  padding:1.3rem 1.8rem;border-radius:1rem;background:rgba(255,255,255,.05);border:.1rem solid rgba(255,255,255,.08);
  opacity:0;transform:translateY(1rem);transition:opacity .3s,transform .3s;pointer-events:none}
#player.panel #learn{opacity:1;transform:none}
.lw-top{display:flex;justify-content:space-between;font-size:.9rem;color:var(--ink3);font-weight:600}
.lw-top .st{color:var(--warm)}
.lw-p{font-family:var(--head);font-weight:800;font-size:2.3rem;letter-spacing:-.02em;line-height:1.15;margin-top:.3rem}
.lw-p .ipa{font-family:var(--body);font-weight:500;font-size:1.15rem;color:var(--accent);letter-spacing:0;margin-left:.6rem}
.lw-m{font-size:1.25rem;color:#fff;margin-top:.2rem}
.lw-q{margin-top:.7rem;font-style:italic;font-size:1.12rem;line-height:1.45;color:#dfe3ff}
.lw-q mark{background:none;color:var(--warm);font-weight:600}
.lw-u{margin-top:.5rem;font-size:1rem;line-height:1.45;color:var(--ink2)}
.lw-ex{margin-top:.5rem;font-size:1.05rem;line-height:1.45;color:#fff}
.lw-ex small{display:block;color:var(--ink2);font-size:.95rem}
.lw-empty{font-size:1.15rem;line-height:1.6;color:var(--ink2)}

body.simple .ph .p{font-size:1.5rem}
body.simple .ph .m{font-size:1.15rem}
body.simple .lw-p{font-size:2.5rem}
body.simple .lw-m,body.simple .lw-q,body.simple .lw-ex{font-size:1.2rem}
body.simple .lw-u{display:none}

/* Chế độ học: kéo khung YouTube cao hơn rồi cắt bớt trên/dưới → ẩn tiêu đề, nút bấm, thanh thời gian.
   Hình video vẫn đầy khung vì YouTube tự giữ tỉ lệ 16:9 ở giữa. Toàn màn hình thì giữ nguyên giao diện YouTube. */
#player.panel #ytWrap iframe{top:-40%;bottom:auto;height:180%;pointer-events:none}

/* Dòng phụ đề riêng (từ file captions), không phụ thuộc phụ đề của YouTube */
#cap{position:absolute;z-index:6;left:50%;bottom:9%;transform:translateX(-50%);max-width:80%;text-align:center;pointer-events:none;
  font-size:1.7rem;line-height:1.35;font-weight:500;color:#fff;padding:.25rem .9rem;border-radius:.5rem;background:rgba(0,0,0,.62);
  transition:opacity .2s}
#cap:empty{opacity:0;padding:0}
#cap mark{background:none;color:#ffd36e;font-weight:700}
#player.panel #cap{left:calc(var(--pad) + var(--vw) / 2);bottom:auto;top:calc(var(--pad) + var(--vh) - .6rem);transform:translate(-50%,-100%);
  max-width:calc(var(--vw) - 3rem);font-size:1.25rem}
body.simple #cap{font-size:2.1rem}
body.simple #player.panel #cap{font-size:1.5rem}

/* Từ đã lưu */
.ph .p .star,.lw-p .star{color:#ffd36e;margin-left:.4rem;font-size:.85em}
:root.day .ph .p .star,:root.day .lw-p .star{color:#c8742a}

/* Huy hiệu "có cụm từ" trên thẻ video */
.badge{position:absolute;left:.5rem;top:.5rem;background:rgba(255,211,110,.95);color:#2a1e00;font-size:.8rem;font-weight:700;padding:.12rem .5rem;border-radius:.35rem}
body.simple .badge{font-size:1.05rem}

/* ---------- Menu nhanh (▼) ---------- */
#qmenu{position:absolute;left:50%;bottom:3rem;transform:translate(-50%,.6rem);z-index:7;display:flex;gap:1rem;padding:1rem;border-radius:1.4rem;background:rgba(12,15,50,.93);box-shadow:0 1rem 3rem rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#qmenu.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.qi{padding:.8rem 1.5rem;border-radius:99rem;background:rgba(255,255,255,.08);font-size:1.2rem;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap}
.qi small{display:block;font-size:.8rem;font-weight:500;color:var(--ink2)}
.qi.info{cursor:default}
.qi.sel{background:#fff;color:#141846}
.qi.sel small{color:#4b5190}
body.simple .qi{font-size:1.6rem}

#toast{position:fixed;left:50%;bottom:3rem;transform:translate(-50%,1rem);z-index:50;max-width:70rem;padding:1rem 1.8rem;border-radius:1rem;background:rgba(22,26,74,.96);border:.1rem solid rgba(255,255,255,.16);font-size:1.2rem;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.simple #toast{font-size:1.6rem}

/* ================= Ban ngày (6:00–18:00): khu vườn sáng, mộc mạc =================
   Ban đêm giữ nền trời sao ở trên. Lớp .day do đoạn script đầu trang bật theo giờ. */
:root.day{
  --bg0:#efe8d6; --bg1:#f7f2e4; --bg2:#e3ecd6;
  --ink:#2c3a2b; --ink2:#5a6852; --ink3:#8a927c;
  --accent:#4f7d45;
  --ring:#3f6b37; --glow:rgba(111,160,92,.35);
  --warm:#c8742a;
  --head:'Fraunces','Be Vietnam Pro',Georgia,serif;
}
:root.day body{
  background:
    radial-gradient(ellipse 60% 50% at 85% -5%, rgba(255,226,160,.55) 0%, transparent 60%),
    radial-gradient(ellipse 55% 45% at -5% 105%, rgba(176,206,150,.5) 0%, transparent 62%),
    linear-gradient(180deg,#f8f4e8,#efe8d6);
}
/* Cành lá ở hai góc thay cho sao */
:root.day body::before{
  opacity:.9;
  background-image:

<body>
<button id="keytrap" tabindex="-1" aria-hidden="true"></button>

<section id="profile" class="screen">
  <h1>Ai đang xem?</h1>

</section>

<section id="home" class="screen">

    <div class="brand"><span class="moon"></span>Kênh nhà mình</div>
    <div class="hright">
      <div class="clock" id="clock"></div>
      <button class="chip" id="chip"></button>
    </div>
  </header>
  <div id="rows"><div id="rowsInner"></div></div>
  <div class="hint">

</section>

  <div id="cap"></div>
  <div id="qmenu"></div>

</section>

<div id="toast"></div>

<script>
/* ===== Dữ liệu mẫu (sau này thay bằng JSON do GitHub Actions tạo) ===== */
const V = (id, title, channel, dur) => ({ id, title, channel, dur });

const SHORT_FILMS = [
  V('YE7VzlLtp-4','Big Buck Bunny','Blender Studio','9:56'),
  V('eRsGyueVLvQ','Sintel','Blender Studio','14:48'),
  V('R6MlUcmOul8','Tears of Steel','Blender Studio','12:14'),
  V('Y-rmzh0PI3c','Cosmos Laundromat','Blender Studio','12:10'),
  V('WhWc3b3KhnY','Spring','Blender Studio','7:44'),
  V('mN0zPOpADL4','Agent 327: Operation Barbershop','Blender Studio','3:51'),
];

const PROFILES = {
  me: {
    label:'Mình', initial:'A', cls:'me', simple:false,
    desc:'Học tiếng Anh: du lịch, công nghệ, TED, khoa học',
    rows:[
      { title:'Marketing & tư duy kinh doanh', items:[
        V('qp0HIF3SfI4','How great leaders inspire action','TED','18:04'),
        V('xBIVlM435Zg','How to get your ideas to spread','TED','17:01'),
        V('rrkrvAUbU9Y','The puzzle of motivation','TED','18:36'),

        V('arj7oStGLkU','Inside the mind of a master procrastinator','TED','14:03'),
        V('iG9CE55wbtY','Do schools kill creativity?','TED','20:03'),
      ]},
      { title:'TED: luyện nghe', items:[

        V('UNP03fDSj1U','Try something new for 30 days','TED','3:27'),
        V('iCvmsMzlF7o','The power of vulnerability','TED','20:49'),
        V('fLJsdqxnZb0','The happy secret to better work','TED','12:20'),
        V('H14bBuluwB8','Grit: the power of passion and perseverance','TED','6:12'),
        V('86x-u-tz0MA','Your elusive creative genius','TED','19:28'),
      ]},
      { title:'Khoa học dễ hiểu', items:[
        V('h6fcK_fRYaI','The Egg – A Short Story','Kurzgesagt','7:55'),
        V('zQGOcOUBi6s','The Immune System Explained','Kurzgesagt','6:48'),
        V('JQVmkDUkZT4','What Are You?','Kurzgesagt','6:42'),
        V('MBRqu0YOH14','Optimistic Nihilism','Kurzgesagt','6:11'),
        V('UjtOGPJ0URM','Why Alien Life Would be our Doom','Kurzgesagt','9:44'),
        V('n3Xv_g3g-mA','Loneliness','Kurzgesagt','7:00'),
      ]},
      { title:'Phim ngắn cuối tuần', items: SHORT_FILMS },
    ]
  },
  parents: {
    label:'Bố mẹ', initial:'BM', cls:'par', simple:true,
    desc:'Sức khỏe, ca nhạc, phim hoạt hình. Chữ to, dễ xem.',
    rows:[
      { title:'Sức khỏe', items:[
        V('5MuIMqhT8DM','Sleep is your superpower','TED','19:18'),
        V('BHY0FxzoKZE','The brain-changing benefits of exercise','TED','13:02'),
        V('qzR62JJCMBQ','All it takes is 10 mindful minutes','TED','9:24'),
        V('8KkKuTCFvzI','What makes a good life?','TED','12:46'),
        V('RcGyVTAoXEU','How to make stress your friend','TED','14:28'),
        V('v-t1Z5-oPtU','How stress affects your body','TED-Ed','4:42'),
      ]},
      { title:'Ca nhạc', items:[
        V('YQHsXMglC9A','Adele – Hello','Adele','6:07'),
        V('2Vv-BfVoq4g','Ed Sheeran – Perfect','Ed Sheeran','4:39'),
        V('RgKAFK5djSk','See You Again','Wiz Khalifa','3:58'),
        V('kJQP7kiw5Fk','Despacito','Luis Fonsi','4:42'),
        V('JGwWNGJdvx8','Shape of You','Ed Sheeran','4:24'),
        V('OPf0YbXqDm0','Uptown Funk','Mark Ronson','4:31'),
        V('9bZkp7q19f0','Gangnam Style','PSY','4:13'),
      ]},
      { title:'Phim hoạt hình', items: SHORT_FILMS },
    ]
  }
};
const PKEYS = ['me','parents'];

/* ===== Danh sách video tiếng Anh theo chủ đề (scripts/video_catalog.py tạo) ===== */
const BASE_ME_ROWS = PROFILES.me.rows.slice();
let PHR_INDEX = {};
const getJSON = url => fetch(url, { cache:'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
const catalogReady = Promise.race([
  Promise.all([getJSON('video-data/catalog.json'), getJSON('video-data/phrases/index.json')]).then(([cat, idx]) => {
    PHR_INDEX = idx || {};
    const extra = ((cat && cat.rows) || []).filter(r => r.items && r.items.length)
      .map(r => ({ title: r.title, items: r.items.map(v => V(v.id, v.title, v.channel, v.dur)) }));
    PROFILES.me.rows = [...extra, ...BASE_ME_ROWS];
  }),
  new Promise(res => setTimeout(res, 3000)),
]);

/* ===== Tiện ích ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const thumbUrl = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
const fmt = s => { s = Math.max(0, Math.floor(s||0)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0'); return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };

let toastT;
function toast(msg, ms=2600){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms);
}

const S = { screen:'profile', pIdx:0, profile:null, row:0, cols:[], header:false, play:null, end:false, endTimer:null, endNext:null, errors:0 };
const rows = () => PROFILES[S.profile].rows;

function show(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === id));
  S.screen = id;
  document.body.dataset.screen = id;
}

/* ===== Màn hình chọn hồ sơ ===== */
function renderProfiles(){
  const last = S.profile || store.get('tvv.profile');
  S.pIdx = Math.max(0, PKEYS.indexOf(last));
  $('#profiles').innerHTML = PKEYS.map((k,i) => {
    const p = PROFILES[k];
    return `<div class="pcard" data-i="${i}"><div class="pav ${p.cls}">${p.initial}</div><div class="pname">${p.label}</div><div class="pdesc">${esc(p.desc)}</div></div>`;
  }).join('');
  focusProfile();
}
function focusProfile(){
  document.querySelectorAll('.pcard').forEach((el,i) => el.classList.toggle('focused', i === S.pIdx));
}
function enterProfile(key){
  catalogReady.then(() => enterProfileNow(key));
}
function enterProfileNow(key){
  S.profile = key; store.set('tvv.profile', key);
  document.body.classList.toggle('simple', PROFILES[key].simple);
  renderHome(); show('home');
  requestAnimationFrame(() => updateFocus());
}
function goProfiles(){ renderProfiles(); show('profile'); }

function profileKey(k){
  if (k === 'left' || k === 'right'){ S.pIdx = (S.pIdx + 1) % PKEYS.length; focusProfile(); }
  else if (k === 'ok') enterProfile(PKEYS[S.pIdx]);
  else if (k === 'back') location.href = './';   // về dashboard (index.html cùng thư mục)
}

/* ===== Màn hình chính ===== */
function cardHTML(v, r, c){
  return `<div class="card${v.blocked?' blocked':''}" data-r="${r}" data-c="${c}">
    <div class="thumb"><img loading="lazy" src="${thumbUrl(v.id)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()"><span class="dur">${esc(v.dur)}</span>${PHR_INDEX[v.id] ? `<span class="badge">Aa ${PHR_INDEX[v.id].n}</span>` : ''}</div>
    <div class="meta"><div class="t">${esc(v.title)}</div><div class="c">${esc(v.channel)}</div></div>
  </div>`;
}
function renderHome(){
  const p = PROFILES[S.profile];
  $('#chip').innerHTML = `<span class="av ${p.cls}">${p.initial}</span><span>${p.label}<em>Đổi hồ sơ</em></span>`;
  $('#rowsInner').innerHTML = p.rows.map((row,r) =>
    `<section class="row"><h2>${esc(row.title)}<span>${row.items.length} video</span></h2>
     <div class="track-wrap"><div class="track">${row.items.map((v,c) => cardHTML(v,r,c)).join('')}</div></div></section>`
  ).join('');
  S.row = 0; S.cols = p.rows.map(() => 0); S.header = false;
  $('#rowsInner').style.transform = 'translateY(0)';
}
function rowEls(){ return document.querySelectorAll('#rowsInner .row'); }

function updateFocus(scroll = true){
  document.querySelectorAll('#home .focused').forEach(e => e.classList.remove('focused'));
  const inner = $('#rowsInner');
  if (S.header){
    $('#chip').classList.add('focused');
    if (scroll) inner.style.transform = 'translateY(0)';
    return;
  }
  const rowEl = rowEls()[S.row];
  const track = rowEl.querySelector('.track');
  const card = track.children[S.cols[S.row]];
  card.classList.add('focused');
  if (!scroll) return;

  // Ngang: giữ một thẻ phía trước để biết còn video bên trái
  const R = rem();
  const gap = parseFloat(getComputedStyle(track).columnGap) || 0;
  const last = track.children[track.children.length - 1];
  const contentW = last.offsetLeft + last.offsetWidth;
  const visW = track.parentNode.clientWidth - R * 8;
  const maxX = Math.max(0, contentW - visW);
  const x = Math.min(Math.max(0, card.offsetLeft - (card.offsetWidth + gap)), maxX);
  track.style.transform = `translateX(${-x}px)`;

  // Dọc: đưa hàng đang chọn lên gần đầu vùng danh sách
  const box = $('#rows');
  const maxY = Math.max(0, inner.offsetHeight - box.clientHeight);
  const y = S.row === 0 ? 0 : Math.min(Math.max(0, rowEl.offsetTop - R), maxY);
  inner.style.transform = `translateY(${-y}px)`;
}

function homeKey(k){
  const rs = rows();
  if (S.header){
    if (k === 'down') S.header = false;
    else if (k === 'ok' || k === 'back'){ goProfiles(); return; }
    updateFocus(); return;
  }
  const c = S.cols[S.row];
  if (k === 'up'){ if (S.row === 0) S.header = true; else S.row--; }
  else if (k === 'down'){ if (S.row < rs.length - 1) S.row++; }
  else if (k === 'left'){ if (c > 0) S.cols[S.row]--; }
  else if (k === 'right'){ if (c < rs[S.row].items.length - 1) S.cols[S.row]++; }
  else if (k === 'ok' || k === 'playpause'){ play(S.row, c); return; }
  else if (k === 'back'){
    // Back lần 1: về đầu danh sách. Back lần 2: về chọn hồ sơ
    if (S.row > 0 || c > 0){ S.row = 0; S.cols = S.cols.map(() => 0); }
    else { goProfiles(); return; }
  }
  updateFocus();
}

/* ===== Trình phát YouTube ===== */
let player = null, ytReady = false, pendingId = null;
window.onYouTubeIframeAPIReady = () => {
  ytReady = true;
  if (pendingId && S.screen === 'player'){ const id = pendingId; pendingId = null; createOrLoad(id); }
};
(function loadYT(){
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => toast('Không tải được trình phát YouTube. Kiểm tra kết nối mạng.');
  document.head.appendChild(s);
})();

function cur(){ return S.play ? rows()[S.play.r].items[S.play.c] : null; }
function nextIdx(r, c){
  const items = rows()[r].items;
  for (let i = c + 1; i < items.length; i++) if (!items[i].blocked) return i;
  return null;
}

function play(r, c){
  const v = rows()[r].items[c];
  if (v.blocked){ toast('Video này không phát được trên TV, hãy chọn video khác'); return; }
  clearEnd();
  S.play = { r, c }; S.row = r; S.cols[r] = c; S.ccApplied = false;
  S.phr = null; S.sel = 0; S.nowIdx = -1; S.cap = null; S.capIdx = -1; $('#cap').textContent = ''; closeMenu();
  loadCaptions(v.id).then(c => { const now = cur(); if (now && now.id === v.id) S.cap = c; });
  show('player');
  osd(v.title, v.channel, 3500, false);
  renderPanel();
  loadPhrases(v.id).then(d => {
    const now = cur(); if (!now || now.id !== v.id) return;
    S.phr = d; renderPanel();
    if (d && !S.panel && learnPref()) openPanel(false);
    else if (d && !S.panel) osd(v.title, `Bấm ▲ để học ${d.phrases.length} cụm từ trong video`, 4500, false);
  });
  if (!ytReady){ pendingId = v.id; return; }
  createOrLoad(v.id);
}

function createOrLoad(id){
  if (player && player.loadVideoById){ player.loadVideoById(id); return; }
  $('#ytWrap').innerHTML = '<div id="yt"></div>';
  // Phụ đề tiếng Việt (hồ sơ Bố mẹ) dùng bản dịch của YouTube; tắt/đổi trong menu ▼
  const m = ccGet();
  const vars = { autoplay:1, rel:0, playsinline:1, iv_load_policy:3, fs:0, hl:'vi',
                 cc_load_policy: m === 'vi' ? 1 : 0, cc_lang_pref: m === 'vi' ? 'vi' : 'en' };
  // Tiếng Anh: trang tự vẽ dòng phụ đề (#cap) vì khung nhúng YouTube không hiện phụ đề ổn định
  // Không ép 1080p nữa: YouTube tự chọn chất lượng theo cỡ khung, khung học nhỏ → tải và tua nhanh hơn
  if (location.protocol.startsWith('http')) vars.origin = location.origin;
  player = new YT.Player('yt', {
    width:'100%', height:'100%', videoId:id, playerVars:vars,
    events:{
      onReady: e => { e.target.playVideo(); refocus(); },
      onStateChange: onState,
      onApiChange: () => { if (S.ccWant) applyCC(S.ccWant, false); },   // danh sách phụ đề vừa nạp xong
      onError: onErr
    }
  });
}

function onState(e){
  if (e.data === YT.PlayerState.PLAYING){
    S.errors = 0;
    if (!S.ccApplied){
      S.ccApplied = true;
      const m = ccGet(); if (m === 'vi') applyCC(m, false);
      applySpeed(speedGet());
    }
  }
  if (e.data === YT.PlayerState.ENDED) showEnd();
}

function onErr(e){
  const v = cur(); if (!v) return;
  const code = e.data;
  v.blocked = true;
  const card = document.querySelector(`.card[data-r="${S.play.r}"][data-c="${S.play.c}"]`);
  if (card) card.classList.add('blocked');
  const msg = (code === 101 || code === 150) ? 'Kênh này không cho phát video trên trang khác. Đang chuyển sang video tiếp theo.'
            : code === 100 ? 'Video không còn trên YouTube. Đang chuyển sang video tiếp theo.'
            : 'Video này không phát được. Đang chuyển sang video tiếp theo.';
  toast(msg, 2400);
  S.errors++;
  const { r, c } = S.play;
  setTimeout(() => {
    if (S.screen !== 'player') return;
    const n = nextIdx(r, c);
    if (n !== null && S.errors < 5) play(r, n);
    else { closePlayer(); toast('Không còn video phát được trong hàng này'); }
  }, 1800);
}

function closePlayer(){
  clearEnd(); closeMenu(); closePanel(false);
  if (player){ try { player.destroy(); } catch(e){} player = null; }   // giải phóng RAM cho TV
  $('#ytWrap').innerHTML = '';
  pendingId = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  show('home');
  requestAnimationFrame(() => updateFocus());
}

function progress(){
  try { return { t: player.getCurrentTime() || 0, d: player.getDuration() || 0 }; }
  catch(e){ return { t:0, d:0 }; }
}

let osdT;
function osd(l1, l2, ms = 1800, bar = true){
  const el = $('#osd');
  el.querySelector('.l1').textContent = l1;
  el.querySelector('.l2').textContent = l2 || '';
  el.classList.toggle('nobar', !bar);
  if (bar){ const { t, d } = progress(); el.querySelector('.bar i').style.width = d ? (t / d * 100) + '%' : '0'; }
  el.classList.add('show');
  clearTimeout(osdT);
  if (ms > 0) osdT = setTimeout(() => el.classList.remove('show'), ms);
}
function qualityLabel(){
  const map = { tiny:'144p', small:'240p', medium:'360p', large:'480p', hd720:'720p', hd1080:'1080p', hd1440:'1440p', hd2160:'4K', highres:'4K+' };
  try { const q = player.getPlaybackQuality(); return map[q] || 'Tự động'; } catch(e){ return 'Tự động'; }
}
function timeLine(){ const { t, d } = progress(); return `${fmt(t)} / ${fmt(d)}`; }

function togglePlay(){
  if (!player || !player.getPlayerState) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING){ player.pauseVideo(); osd('Đang tạm dừng', timeLine(), 0); }
  else { player.playVideo(); osd('Tiếp tục phát', timeLine(), 1500); }
}
function seek(d){
  if (!player || !player.getCurrentTime) return;
  const { t, d: dur } = progress();
  const to = Math.min(Math.max(0, t + d), Math.max(0, dur - 1));
  player.seekTo(to, true);
  setTimeout(() => osd(d > 0 ? 'Tua tới 10 giây' : 'Tua lùi 10 giây', `${fmt(to)} / ${fmt(dur)}`), 60);
}
/* ===== Phụ đề: Tắt → Tiếng Anh → Tiếng Việt, nhớ riêng cho từng hồ sơ ===== */
const CC_MODES = ['off','en','vi'];
const CC_LABEL = { off:'Tắt phụ đề', en:'Phụ đề tiếng Anh', vi:'Phụ đề tiếng Việt' };
function ccGet(){
  // Khóa mới (cc2): mặc định bật phụ đề tiếng Anh, bỏ qua lựa chọn "Tắt" cũ
  return store.get('tvv.cc2.' + S.profile) || (PROFILES[S.profile].simple ? 'vi' : 'en');
}
function ccTracks(){
  try { return player.getOption('captions','tracklist') || []; } catch(e){ return []; }
}
/* YouTube nạp danh sách phụ đề chậm và khác nhau theo máy: thử lại vài lần, và thử lại khi onApiChange báo */
let ccTimer = null;
function applyCC(mode, announce, tries = 0){
  if (!player || !player.loadModule) return;
  clearTimeout(ccTimer);
  S.ccWant = mode === 'off' ? null : mode;
  try {
    if (mode === 'off'){
      player.unloadModule('captions'); player.unloadModule('cc');
      if (announce) osd(CC_LABEL.off, '', 1800, false);
      return;
    }
    player.loadModule('captions');
    const tracks = ccTracks();
    if (!tracks.length){
      if (tries < 8){ ccTimer = setTimeout(() => applyCC(mode, announce, tries + 1), 600); return; }
      if (announce) osd('Video này không có phụ đề', '', 2200, false);
      return;
    }
    const exact = tracks.find(t => (t.languageCode || '').startsWith(mode) && !t.kind) || tracks.find(t => (t.languageCode || '').startsWith(mode));
    const english = tracks.find(t => (t.languageCode || '').startsWith('en'));
    if (exact){
      player.setOption('captions','track',{ languageCode: exact.languageCode });
    } else if (mode === 'vi'){
      // Không có phụ đề tiếng Việt: dịch tự động từ phụ đề có sẵn
      const base = english || tracks[0];
      player.setOption('captions','track',{ languageCode: base.languageCode, translationLanguage:{ languageCode:'vi', languageName:'Tiếng Việt' } });
    } else {
      player.setOption('captions','track',{ languageCode: (english || tracks[0]).languageCode });
    }
    S.ccWant = null;   // đã chọn xong, không áp lại nữa
    if (announce) osd(CC_LABEL[mode], exact || mode !== 'vi' ? '' : 'Dịch tự động', 1800, false);
  } catch(e){
    if (announce) osd('Không đổi được phụ đề cho video này', '', 2200, false);
  }
}
/* Phụ đề tiếng Anh tự vẽ: file captions/<id>.json, mỗi đoạn [start, duration, text] */
const capCache = {};
async function loadCaptions(id){
  if (id in capCache) return capCache[id];
  let c = null;
  try { const r = await fetch(`video-data/captions/${id}.json`, { cache:'no-store' }); if (r.ok) c = (await r.json()).s || null; } catch(e){}
  return capCache[id] = c;
}
function capAt(t){
  const s = S.cap; if (!s || !s.length) return -1;
  let lo = 0, hi = s.length - 1, k = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (s[mid][0] <= t){ k = mid; lo = mid + 1; } else hi = mid - 1; }
  if (k < 0) return -1;
  const end = s[k][0] + Math.max(s[k][1], 1.2);
  return (t <= end + 0.4 || (s[k + 1] && t < s[k + 1][0])) ? k : -1;
}
function tickCaption(){
  const el = $('#cap'); if (!el) return;
  if (S.screen !== 'player' || ccGet() !== 'en' || !S.cap || !player || !player.getCurrentTime){
    if (el.textContent) el.textContent = ''; S.capIdx = -1; return;
  }
  const k = capAt(player.getCurrentTime() || 0);
  if (k === S.capIdx) return;
  S.capIdx = k;
  if (k < 0){ el.textContent = ''; return; }
  const seg = S.cap[k];
  // Tô vàng cụm từ đang học nếu nằm trong câu này
  const ph = S.phr && S.phr.phrases.find(p => Math.abs(p.t - seg[0]) < 0.05);
  el.innerHTML = ph ? markQuote(seg[2], ph.phrase) : esc(seg[2]);
}
setInterval(tickCaption, 200);

function cycleCC(){
  const next = CC_MODES[(CC_MODES.indexOf(ccGet()) + 1) % CC_MODES.length];
  store.set('tvv.cc2.' + S.profile, next);
  S.capIdx = -2;
  if (next === 'vi') applyCC('vi', true);
  else {
    try { player.unloadModule('captions'); player.unloadModule('cc'); } catch(e){}
    osd(CC_LABEL[next], next === 'en' && !S.cap ? 'Video này chưa có file phụ đề' : '', 1800, false);
  }
}

function toggleFullscreen(){
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
}

/* Màn hình hết video: tự phát video kế trong cùng hàng, không có gợi ý ngoài danh sách */
function showEnd(){
  clearEnd(); closeMenu();
  const { r, c } = S.play;
  const row = rows()[r];
  const n = nextIdx(r, c);
  const el = $('#endcard');
  if (n === null){

      <div class="btns"><button class="btn primary" data-act="back">Back: Về danh sách</button></div></div></div>`;
  } else {

      </div></div>`;
    S.endNext = n;
    S.endTimer = setInterval(() => {
      s--; const cd = $('#cd'); if (cd) cd.textContent = s;
      if (s <= 0) play(r, n);

  }
  el.classList.add('show'); S.end = true;
}
function clearEnd(){
  clearInterval(S.endTimer); S.endTimer = null; S.end = false; S.endNext = null;
  $('#endcard').classList.remove('show');
}

function playerKey(k){
  if (S.end){
    if (k === 'ok' && S.endNext !== null) play(S.play.r, S.endNext);
    else if (k === 'back' || k === 'ok') closePlayer();
    return;
  }
  if (S.menu){ menuKey(k); return; }
  if (S.panel){ panelKey(k); return; }
  switch (k){
    case 'back': closePlayer(); break;
    case 'ok': case 'playpause': togglePlay(); break;
    case 'left': seek(-10); break;
    case 'right': seek(10); break;
    case 'up': openPanel(); break;
    case 'down': openMenu(); break;
    case 'fullscreen': toggleFullscreen(); break;
  }
}

/* ===== Cụm từ: đọc file JSON do workflow Gemini + Claude tạo ===== */
const phraseCache = {};
async function loadPhrases(id){
  if (id in phraseCache) return phraseCache[id];
  let d = null;
  try {
    const r = await fetch(`video-data/phrases/${id}.json`, { cache:'no-store' });
    if (r.ok){ const j = await r.json(); if (j.phrases && j.phrases.length) d = j; }
  } catch(e){}
  phraseCache[id] = d;
  return d;
}

function markQuote(q, phrase){
  const qs = esc(q || '');
  const words = String(phrase || '').toLowerCase().split(/\s+/).filter(w => w.length > 2 && !['one','someone','something','sth','sb','the','and','for','your','yours','their','with','from'].includes(w));
  if (!words.length) return qs;
  // Tô màu các từ của cụm từ xuất hiện trong câu trích
  return qs.replace(/[A-Za-zÀ-ỹ'’-]+/g, w => words.some(x => w.toLowerCase().startsWith(x.slice(0, Math.max(3, x.length - 2)))) ? `<mark>${w}</mark>` : w);
}

function renderPanel(){
  const el = $('#panel');
  const d = S.phr;
  if (!d){
    el.innerHTML = `<div class="ph-head"><h3>Cụm từ hay</h3></div>
      <div class="ph-empty">Video này chưa có cụm từ.<br><br>Cụm từ được soạn khi chạy scripts/run_local.sh trên máy Mac.</div>
      <div class="ph-foot"><span><b class="k">OK</b><span class="okl">Phát / Tạm dừng</span></span><span><b class="k">◀▶</b>Tua 10 giây</span><span><b class="k">Back</b>Xem toàn màn hình</span></div>`;
    renderLearn();
    return;
  }
  el.innerHTML = `<div class="ph-head"><h3>Cụm từ hay ${d.level ? `<span>${esc(d.level)}</span>` : ''}<em>${d.phrases.length} cụm</em></h3>
      ${d.summary_vi ? `<div class="ph-sum">${esc(d.summary_vi)}</div>` : ''}</div>
    <div class="ph-list"><div class="ph-inner">${d.phrases.map((p, i) => `
      <div class="ph" data-i="${i}">
        <div class="row1"><div class="p">${esc(p.phrase)}${isSaved(p.phrase) ? '<span class="star">★</span>' : ''}</div><div class="tm">${fmt(p.t)}</div></div>
        <div class="m">${esc(p.meaning_vi)}</div>
      </div>`).join('')}</div></div>
    <div class="ph-foot"><span><b class="k">▲▼</b>Chọn</span><span><b class="k">OK</b><span class="okl"></span></span><span><b class="k">◀</b>Nghe lại câu</span><span><b class="k">▶</b><span class="savel">Lưu từ ★</span></span><span><b class="k">Back</b>Toàn màn hình</span></div>`;
  selectPhrase(Math.min(S.sel, d.phrases.length - 1), false);
  markNow(S.nowIdx);
}

/* Thẻ chi tiết của cụm từ đang chọn, nằm dưới video */
function renderLearn(){
  const el = $('#learn');
  const d = S.phr;
  if (!d){
    const v = cur();
    el.innerHTML = `<div class="lw-top"><span>${v ? esc(v.channel) : ''}</span><span class="st"></span></div>
      <div class="lw-p" style="font-size:1.8rem">${v ? esc(v.title) : ''}</div>
      <div class="lw-empty" style="margin-top:.8rem">Video này chưa có cụm từ. Bạn vẫn xem và nghe bình thường ở khung nhỏ này.</div>`;
    updateLearnState();
    return;
  }
  const p = d.phrases[S.sel]; if (!p) return;
  el.innerHTML = `<div class="lw-top"><span>Cụm từ ${S.sel + 1}/${d.phrases.length} · ${fmt(p.t)}</span><span class="st"></span></div>
    <div class="lw-p">${esc(p.phrase)}${isSaved(p.phrase) ? '<span class="star">★ đã lưu</span>' : ''}${p.ipa ? `<span class="ipa">${esc(p.ipa)}</span>` : ''}</div>
    <div class="lw-m">${esc(p.meaning_vi)}</div>
    <div class="lw-q">“${markQuote(p.quote, p.phrase)}”</div>
    ${p.usage_vi ? `<div class="lw-u">${esc(p.usage_vi)}</div>` : ''}
    ${p.example_en ? `<div class="lw-ex">${esc(p.example_en)}<small>${esc(p.example_vi)}</small></div>` : ''}`;
  updateLearnState();
}

function isPlaying(){ try { return player.getPlayerState() === YT.PlayerState.PLAYING; } catch(e){ return false; } }

/* OK trong chế độ học:
   - đang đứng ở cụm từ đang phát → Tạm dừng / Phát tiếp
   - chọn cụm từ khác → nhảy tới câu đó và phát */
function okAction(){
  if (!S.phr) return isPlaying() ? 'pause' : 'resume';
  if (S.sel === currentPhraseIdx()) return isPlaying() ? 'pause' : 'resume';
  return 'jump';
}
const OK_LABEL = { pause:'Tạm dừng', resume:'Phát tiếp', jump:'Nghe câu này' };
function updateLearnState(){
  if (!S.panel) return;
  const a = okAction();
  const okl = $('#panel .okl'); if (okl && okl.textContent !== OK_LABEL[a]) okl.textContent = OK_LABEL[a];
  const st = $('#learn .st');
  if (st){
    const txt = isPlaying() ? (S.sel === S.nowIdx ? '● Đang nói câu này' : '● Đang phát') : 'Ⅱ Tạm dừng';
    if (st.textContent !== txt) st.textContent = txt;
  }
}

function selectPhrase(i, animate = true){
  if (!S.phr) return;
  S.sel = Math.max(0, Math.min(i, S.phr.phrases.length - 1));
  const items = document.querySelectorAll('#panel .ph');
  items.forEach((el, j) => el.classList.toggle('sel', j === S.sel));
  renderLearn();
  const el = items[S.sel], inner = $('#panel .ph-inner'), list = $('#panel .ph-list');
  if (!el || !inner) return;
  if (!animate) inner.style.transition = 'none';
  requestAnimationFrame(() => {
    const max = Math.max(0, inner.offsetHeight - list.clientHeight);
    const y = Math.min(Math.max(0, el.offsetTop - list.clientHeight * 0.3), max);
    inner.style.transform = `translateY(${-y}px)`;
    if (!animate) requestAnimationFrame(() => inner.style.transition = '');
  });
}

function markNow(idx){
  S.nowIdx = idx;
  document.querySelectorAll('#panel .ph').forEach((el, j) => el.classList.toggle('now', j === idx));
  updateLearnState();
}

function currentPhraseIdx(){
  if (!S.phr) return -1;
  const { t } = progress();
  let idx = -1;
  S.phr.phrases.forEach((p, i) => { if (p.t <= t + 0.5) idx = i; });
  return idx;
}

/* Nhớ chế độ học cho từng hồ sơ: video sau mở ra cũng ở chế độ học */
const learnPref = () => store.get('tvv.learn.' + S.profile) === '1';
function openPanel(remember = true){
  S.panel = true;
  if (remember) store.set('tvv.learn.' + S.profile, '1');
  $('#player').classList.add('panel');
  $('#osd').classList.remove('show');
  renderPanel();
  const idx = currentPhraseIdx();
  if (idx >= 0) selectPhrase(idx, false);
  markNow(idx);
  // Video vẫn chạy tiếp, không tạm dừng
}
function closePanel(remember = true){
  if (!S.panel) return;
  S.panel = false;
  if (remember) store.set('tvv.learn.' + S.profile, '0');
  $('#player').classList.remove('panel');
}
/* Lưu cụm từ vào kho chung: dashboard sao băng đọc cùng localStorage (cùng địa chỉ trang) */
const SAVED_KEY = 'meteor-saved-v1';
function savedList(){ try { const l = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); return Array.isArray(l) ? l : []; } catch(e){ return []; } }
const isSaved = w => savedList().some(o => (o.w || '').toLowerCase() === String(w).toLowerCase());
function toggleSave(i){
  const p = S.phr && S.phr.phrases[i]; if (!p) return;
  let l = savedList();
  const key = p.phrase.toLowerCase();
  if (l.some(o => (o.w || '').toLowerCase() === key)){
    l = l.filter(o => (o.w || '').toLowerCase() !== key);
    toast(`Đã bỏ lưu “${p.phrase}”`);
  } else {
    const v = cur();
    l.unshift({ w: p.phrase, ipa: p.ipa || '', pos: 'từ video', vi: p.meaning_vi || '', ex: p.example_en || p.quote || '',
                col: p.quote ? [p.quote.length > 60 ? p.quote.slice(0, 57) + '…' : p.quote] : [],
                saved: true, added: new Date().toISOString().slice(0, 10), src: { id: v && v.id, t: p.t, title: v && v.title } });
    toast(`★ Đã lưu “${p.phrase}”. Từ này sẽ bay trên màn hình sao băng.`, 3200);
  }
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(l)); } catch(e){ toast('Không lưu được trên thiết bị này'); }
  const keep = S.sel; renderPanel(); selectPhrase(keep, false);
}

function playPhrase(i){
  if (!S.phr || !player || !player.seekTo) return;
  const p = S.phr.phrases[i];
  player.seekTo(Math.max(0, p.t - 0.3), true);   // start lấy nguyên từ phụ đề YouTube
  player.playVideo();
  S.navHold = 0;
  markNow(i);
}
function panelKey(k){
  const n = S.phr ? S.phr.phrases.length : 0;
  switch (k){
    case 'back': closePanel(); break;
    case 'up': if (n){ selectPhrase(S.sel - 1); S.navHold = Date.now() + 8000; } break;
    case 'down': if (n){ selectPhrase(S.sel + 1); S.navHold = Date.now() + 8000; } break;
    case 'ok': {
      const a = okAction();
      if (a === 'jump') playPhrase(S.sel);
      else if (a === 'pause') player.pauseVideo();
      else player.playVideo();
      setTimeout(updateLearnState, 250);
      break;
    }
    case 'playpause': togglePlay(); break;
    case 'left': if (n) playPhrase(S.sel); else seek(-10); break;
    case 'right': if (n) toggleSave(S.sel); else seek(10); break;
  }
}
// Khi video đang chạy: đánh dấu cụm từ vừa được nói và cho danh sách chạy theo
setInterval(() => {
  if (S.screen !== 'player' || !player || !player.getPlayerState) return;
  updateLearnState();
  if (!S.phr || !isPlaying()) return;
  const idx = currentPhraseIdx();
  if (idx !== S.nowIdx) markNow(idx);
  if (S.panel && idx >= 0 && idx !== S.sel && Date.now() > (S.navHold || 0)) selectPhrase(idx);
}, 500);

/* ===== Tốc độ phát ===== */
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5];
function speedGet(){ const v = parseFloat(store.get('tvv.speed.' + S.profile)); return SPEEDS.includes(v) ? v : 1; }
function applySpeed(r){ try { player.setPlaybackRate(r); } catch(e){} }
function nextSpeed(){
  const r = SPEEDS[(SPEEDS.indexOf(speedGet()) + 1) % SPEEDS.length];
  store.set('tvv.speed.' + S.profile, String(r));
  applySpeed(r);
}

/* ===== Menu nhanh (▼): tốc độ, phụ đề, chất lượng ===== */
let menuT;
function menuItems(){
  return [
    { key:'speed', label:`Tốc độ ${String(speedGet()).replace('.', ',')}×`, sub:'OK để đổi' },
    { key:'cc', label:CC_LABEL[ccGet()], sub:'OK để đổi' },
    { key:'quality', label:qualityLabel(), sub:'Chất lượng (YouTube tự chọn)', info:true },
  ];
}
function renderMenu(){
  $('#qmenu').innerHTML = menuItems().map((m, i) =>
    `<div class="qi${m.info ? ' info' : ''}${i === S.msel ? ' sel' : ''}" data-i="${i}">${esc(m.label)}<small>${esc(m.sub)}</small></div>`).join('');
}
function bumpMenuTimer(){ clearTimeout(menuT); menuT = setTimeout(closeMenu, 8000); }
function openMenu(){ S.menu = true; S.msel = S.msel || 0; renderMenu(); $('#qmenu').classList.add('show'); bumpMenuTimer(); }
function closeMenu(){ S.menu = false; clearTimeout(menuT); const m = $('#qmenu'); if (m) m.classList.remove('show'); }
function menuAct(i){
  const it = menuItems()[i];
  if (it.key === 'speed') nextSpeed();
  else if (it.key === 'cc'){ cycleCC(); setTimeout(() => S.menu && renderMenu(), 900); }
  renderMenu(); bumpMenuTimer();
}
function menuKey(k){
  const n = menuItems().length;
  if (k === 'left'){ S.msel = (S.msel + n - 1) % n; renderMenu(); bumpMenuTimer(); }
  else if (k === 'right'){ S.msel = (S.msel + 1) % n; renderMenu(); bumpMenuTimer(); }
  else if (k === 'ok') menuAct(S.msel);
  else if (k === 'playpause') togglePlay();
  else closeMenu();   // ▲, ▼ hoặc Back
}

/* ===== Bàn phím, remote, chuột ===== */
function keyName(e){
  const k = e.key, c = e.keyCode;
  if (k === 'ArrowUp' || c === 38) return 'up';
  if (k === 'ArrowDown' || c === 40) return 'down';
  if (k === 'ArrowLeft' || c === 37) return 'left';
  if (k === 'ArrowRight' || c === 39) return 'right';
  if (k === 'Enter' || k === 'Select' || c === 13 || c === 23) return 'ok';
  if (k === 'Escape' || k === 'Backspace' || k === 'GoBack' || k === 'BrowserBack' || c === 27 || c === 8 || c === 4) return 'back';
  if (k === 'MediaPlayPause' || k === ' ' || c === 179 || c === 85) return 'playpause';
  if (k === 'f' || k === 'F') return 'fullscreen';
  return null;
}
let lastBack = 0;
function dispatch(k){
  if (k === 'back'){ const now = Date.now(); if (now - lastBack < 300) return; lastBack = now; }
  if (S.screen === 'profile') profileKey(k);
  else if (S.screen === 'home') homeKey(k);
  else if (S.screen === 'player') playerKey(k);
}
document.addEventListener('keydown', e => { const k = keyName(e); if (!k) return; e.preventDefault(); dispatch(k); });
window.tvBack = () => { dispatch('back'); return true; };   // app Android gọi khi bấm Back

// Khi bấm chuột vào trình phát, kéo tiêu điểm bàn phím về trang để phím mũi tên/Back vẫn hoạt động
function refocus(){ setTimeout(() => { try { $('#keytrap').focus({ preventScroll:true }); } catch(e){} }, 0); }
window.addEventListener('blur', () => { if (S.screen === 'player') refocus(); });

$('#profiles').addEventListener('click', e => { const p = e.target.closest('.pcard'); if (p) enterProfile(PKEYS[+p.dataset.i]); });
$('#profiles').addEventListener('mouseover', e => { const p = e.target.closest('.pcard'); if (p){ S.pIdx = +p.dataset.i; focusProfile(); } });
$('#chip').addEventListener('click', goProfiles);
$('#rowsInner').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) play(+c.dataset.r, +c.dataset.c); });
$('#rowsInner').addEventListener('mouseover', e => {
  const c = e.target.closest('.card'); if (!c) return;
  const r = +c.dataset.r, col = +c.dataset.c;
  if (S.header || S.row !== r || S.cols[r] !== col){ S.header = false; S.row = r; S.cols[r] = col; updateFocus(false); }
});
let wheelT = 0;
$('#home').addEventListener('wheel', e => {
  e.preventDefault();
  const now = Date.now(); if (now - wheelT < 180) return; wheelT = now;
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) homeKey(e.deltaX > 0 ? 'right' : 'left');
  else homeKey(e.deltaY > 0 ? 'down' : 'up');
}, { passive:false });
$('#pBack').addEventListener('click', closePlayer);
$('#panel').addEventListener('click', e => { const p = e.target.closest('.ph'); if (p){ selectPhrase(+p.dataset.i); playPhrase(+p.dataset.i); } });
$('#qmenu').addEventListener('click', e => { const q = e.target.closest('.qi'); if (q){ S.msel = +q.dataset.i; menuAct(S.msel); } });
$('#endcard').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'next' && S.endNext !== null) play(S.play.r, S.endNext); else closePlayer();
});
window.addEventListener('resize', () => { if (S.screen === 'home') updateFocus(); });

/* ===== Đồng hồ ===== */
function tick(){
  const d = new Date();
  const time = d.toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
  const day = d.toLocaleDateString('vi-VN', { weekday:'long', day:'numeric', month:'numeric' });
  $('#clock').innerHTML = `${time}<small>${day.charAt(0).toUpperCase() + day.slice(1)}</small>`;
}
tick(); setInterval(tick, 15000);

renderProfiles(); show('profile');
</script>
</body>
